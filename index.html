<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ShadowForge | Database Lookup</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg: #030305;
    --panel: rgba(12, 12, 15, 0.85);
    --panel-border: rgba(255, 42, 42, 0.25);
    --accent: #ff2a2a;
    --accent-glow: rgba(255, 42, 42, 0.5);
    --accent-gradient: linear-gradient(135deg, #ff2a2a, #8b0000);
    --text: #e8e8e8;
    --text-muted: #888899;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Rajdhani', sans-serif;
  }
  html,body{height:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* Heavy Cyber Grid & Glow */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: 
      linear-gradient(rgba(255, 42, 42, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 42, 42, 0.04) 1px, transparent 1px);
    background-size: 30px 30px;
    background-position: center center;
    mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.3) 2px, rgba(0,0,0,0.3) 4px);
    opacity: 0.4;
  }

  /* ===== TOP BAR ===== */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(3, 3, 5, 0.9);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    border-bottom:1px solid var(--panel-border);
    padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow: 0 5px 20px rgba(0,0,0,0.8);
  }
  
  .menu-btn{
    background:none; border:none; color:var(--accent);
    font-family: var(--mono); font-size: 20px; cursor:pointer;
    display: flex; align-items: center; gap: 8px; transition: 0.2s;
  }
  .menu-btn:hover { color: #fff; text-shadow: 0 0 10px var(--accent); }
  
  .brand{
    font-size: 1.3rem; font-weight: 800; letter-spacing: 4px; text-transform: uppercase;
    background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
    font-family: var(--mono); text-shadow: 0 0 25px var(--accent-glow); margin-left: -20px;
  }

  .status-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 12px var(--accent); animation: pulse 1.5s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.4; transform:scale(0.8);} }

  /* ===== MAIN LAYOUT ===== */
  .wrap{
    position:relative;z-index:10;max-width:600px;margin:0 auto;
    padding:30px 16px 60px;
  }

  /* ===== HERO ===== */
  .hero { margin-bottom: 30px; text-align: center; position: relative; }
  .hero h1 {
    font-family: var(--mono); font-size: 1.8rem; letter-spacing: 6px;
    color: #fff; margin-bottom: 8px; text-shadow: 0 0 20px rgba(255,255,255,0.1);
  }
  .hero p { color: var(--accent); font-size: 0.9rem; letter-spacing: 3px; font-family: var(--mono); font-weight: bold; }
  
  /* ===== SEARCH PANEL (Heavy Glass) ===== */
  .panel {
    background: linear-gradient(180deg, rgba(20,20,25,0.9), rgba(10,10,12,0.9));
    border: 1px solid var(--panel-border);
    border-radius: 16px; padding: 24px; margin-bottom: 24px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.08);
    position: relative; overflow: hidden;
  }
  .panel::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--accent-gradient); box-shadow: 0 0 10px var(--accent);
  }
  
  .input-group { display: flex; gap: 12px; }
  #number {
    flex: 1; background: rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text); font-family: var(--mono); font-size: 16px;
    padding: 0 18px; border-radius: 10px; outline: none; transition: 0.3s;
    height: 56px; letter-spacing: 1px;
  }
  #number:focus { border-color: var(--accent); box-shadow: 0 0 20px rgba(255,42,42,0.25); background: rgba(0,0,0,1); }
  #number::placeholder { color: #555; }
  
  #go {
    background: var(--accent-gradient); border: none; border-radius: 10px;
    color: #fff; font-family: var(--sans); font-weight: 800; font-size: 16px;
    padding: 0 28px; cursor: pointer; transition: 0.3s; letter-spacing: 2px;
    text-transform: uppercase; box-shadow: 0 8px 20px rgba(255,42,42,0.3);
    position: relative; overflow: hidden;
  }
  #go::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transition: 0.5s;
  }
  #go:hover::after { left: 100%; }
  #go:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(255,42,42,0.5); }
  #go:active { transform: translateY(0); }
  #go:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* ===== MAP CONTAINER ===== */
  .map-container {
    margin-top: 24px; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--panel-border); position: relative;
    background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  .map-container iframe { width: 100%; height: 240px; border: none; display: block; opacity: 0.8; filter: grayscale(1) contrast(1.3) sepia(0.2) hue-rotate(320deg); transition: 0.4s; }
  .map-container:hover iframe { opacity: 1; filter: grayscale(0) contrast(1.1); }
  .map-header {
    position: absolute; top: 0; left: 0; right: 0; background: rgba(10,10,15,0.9);
    padding: 12px 16px; font-family: var(--mono); font-size: 12px; color: var(--accent);
    letter-spacing: 2px; display: flex; justify-content: space-between; z-index: 2; pointer-events: none;
    border-bottom: 1px solid var(--panel-border); backdrop-filter: blur(5px);
  }

  /* ===== RECORD CARDS (Heavy) ===== */
  .record-card {
    background: linear-gradient(135deg, rgba(20,20,25,0.9), rgba(10,10,15,0.95));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; margin-bottom: 20px; overflow: hidden;
    position: relative; animation: slideUp 0.4s ease-out;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  
  .rec-header {
    background: rgba(255,42,42,0.08); padding: 14px 20px; border-bottom: 1px solid rgba(255,42,42,0.15);
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 2px;
    text-shadow: 0 0 10px var(--accent-glow);
  }
  .rec-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  
  .data-row {
    display: flex; align-items: flex-start; gap: 14px;
    border-bottom: 1px dashed rgba(255,255,255,0.08); padding-bottom: 16px;
  }
  .data-row:last-child { border-bottom: none; padding-bottom: 0; }
  
  .data-icon {
    width: 40px; height: 40px; border-radius: 10px; background: rgba(255,42,42,0.1);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); flex-shrink: 0; border: 1px solid rgba(255,42,42,0.2);
    box-shadow: inset 0 0 10px rgba(255,42,42,0.1);
  }
  .data-icon svg { width: 18px; height: 18px; }
  
  .data-content { flex: 1; min-width: 0; }
  .data-label { font-size: 11px; color: var(--text-muted); font-family: var(--mono); letter-spacing: 1.5px; margin-bottom: 4px; text-transform: uppercase; }
  .data-value { font-size: 17px; font-weight: 700; word-break: break-word; color: #fff; line-height: 1.4; font-family: var(--sans); letter-spacing: 0.5px; }
  
  .copy-btn {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-muted); border-radius: 8px; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: 0.2s; flex-shrink: 0; margin-top: 2px;
  }
  .copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); transform: scale(1.05); }
  .copy-btn svg { width: 16px; height: 16px; }
  .copy-btn.copied { background: #00e676; color: #000; border-color: #00e676; box-shadow: 0 0 15px rgba(0,230,118,0.4); }

  /* Network Badge */
  .net-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 800; font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 1.5px; margin-top: 8px;
    border: 1px solid transparent; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }
  .net-badge span.dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }

  /* ===== LOADING & MESSAGES ===== */
  .loading-state { text-align: center; padding: 60px 20px; font-family: var(--mono); color: var(--accent); letter-spacing: 2px; font-size: 14px; }
  .spinner {
    width: 50px; height: 50px; border: 4px solid rgba(255,42,42,0.1); border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 20px; animation: spin 1s linear infinite;
    box-shadow: 0 0 20px rgba(255,42,42,0.2);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .error-state { text-align: center; padding: 40px 20px; border: 1px solid rgba(255,0,0,0.3); background: rgba(255,0,0,0.05); border-radius: 16px; color: #ff5252; font-family: var(--mono); font-size: 14px; letter-spacing: 1px; margin-bottom: 20px; box-shadow: inset 0 0 20px rgba(255,0,0,0.1);}

  /* ===== SIDE MENU (Heavy & Sleek) ===== */
  .menu-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    z-index: 99; opacity: 0; visibility: hidden; transition: 0.4s;
  }
  .menu-overlay.active { opacity: 1; visibility: visible; }
  
  .side-menu {
    position: fixed; top: 0; left: 0; bottom: 0; width: 300px;
    background: linear-gradient(180deg, #08080c, #030305);
    border-right: 1px solid var(--panel-border);
    z-index: 100; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex; flex-direction: column; box-shadow: 10px 0 50px rgba(0,0,0,0.9);
  }
  .side-menu.active { transform: translateX(0); }
  
  .menu-head {
    padding: 35px 24px; border-bottom: 1px solid var(--panel-border);
    background: linear-gradient(180deg, rgba(255,42,42,0.15), transparent);
    position: relative; overflow: hidden;
  }
  .menu-head::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--accent);
  }
  .menu-head h2 { font-family: var(--mono); font-size: 22px; color: #fff; letter-spacing: 3px; text-shadow: 0 0 15px rgba(255,42,42,0.5); }
  .menu-head p { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-top: 8px; letter-spacing: 2px; font-weight: bold;}
  
  .menu-links { flex: 1; padding: 24px 16px; display: flex; flex-direction: column; gap: 12px; }
  .menu-link {
    display: flex; align-items: center; gap: 16px; padding: 16px;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px; text-decoration: none; color: var(--text); transition: 0.3s;
    position: relative; overflow: hidden;
  }
  .menu-link::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); opacity: 0; transition: 0.3s;
  }
  .menu-link:hover { background: rgba(255,42,42,0.08); border-color: rgba(255,42,42,0.3); transform: translateX(5px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
  .menu-link:hover::before { opacity: 1; }
  .menu-link .m-icon { font-size: 22px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
  .menu-link .m-text { font-family: var(--sans); font-weight: 700; font-size: 16px; letter-spacing: 0.5px; }
  .menu-link .m-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; font-family: var(--mono); }

  .menu-foot { padding: 24px 20px; border-top: 1px solid var(--panel-border); text-align: center; font-size: 11px; font-family: var(--mono); color: var(--text-muted); letter-spacing: 1px; line-height: 1.6; }

</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <button class="menu-btn" id="menuBtn">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>

<script>
// ==========================================
// ICONS
// ==========================================
var ICONS = {
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.7 2.6a2 2 0 0 1-.5 2.1L8.1 9.5a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.1-.5c.8.4 1.7.6 2.6.7a2 2 0 0 1 1.7 2z"/></svg>',
  cnic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="11" r="2"/><path d="M14 10h4M14 14h4M6 15.5c.5-1 2-1.5 2-1.5"/></svg>',
  address: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'
};

// ==========================================
// NETWORK STYLES
// ==========================================
var NET_MAP = {
  jazz:    { bg:"rgba(230,57,70,0.15)", fg:"#ff5252", dot:"#E63946" },
  ufone:   { bg:"rgba(247,127,0,0.15)", fg:"#ff9800", dot:"#F77F00" },
  zong:    { bg:"rgba(157,78,221,0.15)", fg:"#b388ff", dot:"#9D4EDD" },
  telenor: { bg:"rgba(0,119,182,0.15)", fg:"#4fc3f7", dot:"#0077B6" },
  scom:    { bg:"rgba(42,157,143,0.15)", fg:"#00e676", dot:"#2A9D8F" },
  warid:   { bg:"rgba(255,183,3,0.15)", fg:"#f7b733", dot:"#FFB703" }
};
function netStyle(net) {
  var k = String(net || "").toLowerCase().replace(/[^a-z]/g, "");
  return NET_MAP[k] || { bg:"rgba(255,42,42,0.15)", fg:"#ff2a2a", dot:"#ff2a2a" };
}

// ==========================================
// HELPERS & NETWORK DETECTOR FIX (STRICT STANDARD)
// ==========================================
function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function pickField(obj, keys) {
  for (var i = 0; i < keys.length; i++) {
    if (Object.prototype.hasOwnProperty.call(obj, keys[i])) {
      var v = obj[keys[i]];
      if (v === null || v === undefined) continue;
      var s = String(v).trim();
      if (!s || s.toUpperCase() === "NULL" || s.toUpperCase() === "N/A") continue;
      return s;
    }
  }
  return "";
}

// 100% Correct Pakistan Prefix Detection
function detectNetworkFromPrefix(number, apiNetwork) {
  // If API gives a specific correct network, use it. If it gives 'Jazz' (default wrong), ignore it.
  if (apiNetwork && apiNetwork.trim() !== "" && apiNetwork.toUpperCase() !== "JAZZ" && apiNetwork.toUpperCase() !== "NULL") {
    return apiNetwork;
  }
  
  var num = String(number || "").replace(/\D/g, "");
  if (num.startsWith("92")) num = "0" + num.substring(2);
  if (!num.startsWith("0")) return "Unknown";
  
  var code3 = num.substring(0, 3); // e.g., "031"
  var code4 = num.substring(0, 4); // e.g., "0310"

  // Zong (0310 to 0319)
  if (["0310","0311","0312","0313","0314","0315","0316","0317","0318","0319"].includes(code4)) return "Zong";
  // Jazz (0300 to 0309 AND 0320 to 0329)
  if (["0300","0301","0302","0303","0304","0305","0306","0307","0308","0309", "0320","0321","0322","0323","0324","0325","0326","0327","0328","0329"].includes(code4)) return "Jazz";
  // Ufone (0330 to 0339)
  if (["0330","0331","0332","0333","0334","0335","0336","0337","0338","0339"].includes(code4)) return "Ufone";
  // Telenor (0340 to 0349)
  if (["0340","0341","0342","0343","0344","0345","0346","0347","0348","0349"].includes(code4)) return "Telenor";
  // SCOM (0355)
  if (code4 === "0355") return "SCOM";

  // 3-digit fallbacks just in case
  if (code3 === "031") return "Zong";
  if (code3 === "030" || code3 === "032") return "Jazz";
  if (code3 === "033") return "Ufone";
  if (code3 === "034") return "Telenor";
  if (code3 === "035") return "SCOM";

  return "Unknown";
}

function normalise(raw, searchedNumber) {
  var src = [];
  if (!raw) return [];
  if (Array.isArray(raw)) src = raw;
  else if (Array.isArray(raw.records)) src = raw.records;
  else if (Array.isArray(raw.data)) src = raw.data;
  else if (typeof raw === "object") src = [raw];

  var seen = {}, out = [];
  src.forEach(function (item) {
    if (!item || typeof item !== "object") return;
    
    // Get mobile number first
    var mob = pickField(item, ["mobile", "number", "phone", "msisdn", "cell"]);
    
    // Get network from API
    var apiNet = pickField(item, ["network", "carrier", "operator", "sim"]);
    
    // FIX: Detect real network based on number prefix
    var finalNet = detectNetworkFromPrefix(mob || searchedNumber, apiNet);
    
    var r = {
      name:    pickField(item, ["name", "fullname", "full_name", "subscriber", "owner"]),
      mobile:  mob,
      cnic:    pickField(item, ["cnic", "nic", "id_card", "identity"]),
      address: pickField(item, ["address", "addr", "location", "city"]),
      network: finalNet
    };
    
    if (!r.name && !r.mobile && !r.cnic && !r.address && !r.network) return;
    var sig = (r.name + "|" + r.mobile + "|" + r.cnic + "|" + r.address + "|" + r.network).toLowerCase();
    if (seen[sig]) return;
    seen[sig] = 1;
    out.push(r);
  });
  return out;
}

// ==========================================
// COPY TO CLIPBOARD
// ==========================================
function copyText(txt, btnElement) {
  function success() {
    if (btnElement) {
      var oldHtml = btnElement.innerHTML;
      btnElement.classList.add('copied');
      btnElement.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      setTimeout(function() {
        btnElement.classList.remove('copied');
        btnElement.innerHTML = oldHtml;
      }, 1500);
    }
  }
  
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(success).catch(function () { legacyCopy(txt, success); });
  } else {
    legacyCopy(txt, success);
  }
}
function legacyCopy(txt, done) {
  try {
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    if (done) done();
  } catch (e) {}
}

// ==========================================
// RENDER RECORDS
// ==========================================
function renderRecords(records, searchedNumber) {
  var out = document.getElementById('result');
  
  if (!records.length) {
    out.innerHTML = '<div class="error-state">NO RECORDS FOUND IN DATABASE FOR THIS NUMBER.</div>';
    return;
  }

  // Map based on first record's address
  var mapLocation = records[0].address || "Pakistan";
  var mapSrc = "https://maps.google.com/maps?q=" + encodeURIComponent(mapLocation) + "&t=&z=11&ie=UTF8&iwloc=&output=embed";
  
  var html = '';
  
  // Add Map at the top
  html += '<div class="map-container">';
  html += '<div class="map-header"><span>LIVE TRACKING</span><span>' + esc(mapLocation).toUpperCase() + '</span></div>';
  html += '<iframe src="' + mapSrc + '" loading="lazy"></iframe>';
  html += '</div><br>';

  records.forEach(function(r, i) {
    var ns = netStyle(r.network);
    
    html += '<div class="record-card">';
    
    html += '<div class="rec-header">';
    html += '<span>TARGET RECORD #' + (i + 1) + '</span>';
    html += '<span style="color:var(--text-muted);font-size:11px;">SECURE</span>';
    html += '</div>';
    
    html += '<div class="rec-body">';
    
    // Name
    if(r.name) {
      html += '<div class="data-row">';
      html += '<div class="data-icon">' + ICONS.user + '</div>';
      html += '<div class="data-content"><div class="data-label">Name</div><div class="data-value">' + esc(r.name) + '</div></div>';
      html += '<button class="copy-btn" onclick="copyText(\'' + esc(r.name).replace(/'/g, "\\'") + '\', this)">' + ICONS.copy + '</button>';
      html += '</div>';
    }
    
    // Mobile
    if(r.mobile) {
      html += '<div class="data-row">';
      html += '<div class="data-icon">' + ICONS.phone + '</div>';
      html += '<div class="data-content"><div class="data-label">Mobile Number</div><div class="data-value">' + esc(r.mobile) + '</div>';
      if(r.network && r.network !== "Unknown") {
        html += '<div class="net-badge" style="background:' + ns.bg + ';color:' + ns.fg + ';border-color:' + ns.bg + '">';
        html += '<span class="dot" style="background:' + ns.dot + '"></span>' + esc(r.network);
        html += '</div>';
      }
      html += '</div>';
      html += '<button class="copy-btn" onclick="copyText(\'' + esc(r.mobile).replace(/'/g, "\\'") + '\', this)">' + ICONS.copy + '</button>';
      html += '</div>';
    }
    
    // CNIC
    if(r.cnic) {
      html += '<div class="data-row">';
      html += '<div class="data-icon">' + ICONS.cnic + '</div>';
      html += '<div class="data-content"><div class="data-label">CNIC Number</div><div class="data-value">' + esc(r.cnic) + '</div></div>';
      html += '<button class="copy-btn" onclick="copyText(\'' + esc(r.cnic).replace(/'/g, "\\'") + '\', this)">' + ICONS.copy + '</button>';
      html += '</div>';
    }
    
    // Address
    if(r.address) {
      html += '<div class="data-row">';
      html += '<div class="data-icon">' + ICONS.address + '</div>';
      html += '<div class="data-content"><div class="data-label">Registered Address</div><div class="data-value">' + esc(r.address) + '</div></div>';
      html += '<button class="copy-btn" onclick="copyText(\'' + esc(r.address).replace(/'/g, "\\'") + '\', this)">' + ICONS.copy + '</button>';
      html += '</div>';
    }
    
    html += '</div></div>'; 
  });

  out.innerHTML = html;
}

// ==========================================
// API LOOKUP & MAIN LOGIC
// ==========================================
(function () {
  "use strict";
  var _p = ["htt","ps:","//w","asi","fal","i.b","iz.","id/","pub","lic",
            "_ap","is/","sim","-in","fo-","api",".ph","p?s","ear","ch="];
  var API_BASE = _p.join("");

  var input = document.getElementById("number");
  var btn   = document.getElementById("go");
  var out   = document.getElementById("result");

  function setLoading(on) {
    btn.disabled = on;
    btn.innerHTML = on ? '<div class="spinner" style="width:22px;height:22px;border-width:2px;margin:0 auto;"></div>' : 'RUN';
  }

  function lookup() {
    var raw = input.value.trim();
    var num = raw.replace(/[^\d+]/g, "");
    
    if (num.replace(/\D/g, "").length < 6) {
      out.innerHTML = '<div class="error-state">PLEASE ENTER A VALID PHONE NUMBER.</div>';
      return;
    }

    setLoading(true);
    out.innerHTML = '<div class="loading-state"><div class="spinner"></div>SCANNING DATABASE...</div>';

    fetch(API_BASE + encodeURIComponent(num), { headers: { "Accept": "application/json" } })
      .then(function (res) {
        return res.text().then(function (txt) {
          if (!res.ok) throw new Error("HTTP ERROR: " + res.status);
          var data;
          try { data = JSON.parse(txt); } catch (e) { data = txt; }
          return data;
        });
      })
      .then(function (data) {
        if (typeof data === "string") {
          out.innerHTML = '<div class="error-state">UNEXPECTED RESPONSE FORMAT.</div>';
          return;
        }
        var records = normalise(data, num); // Pass searched number to detect network
        renderRecords(records, num);
      })
      .catch(function (err) {
        out.innerHTML = '<div class="error-state">' + (err.message || "NETWORK ERROR. TRY AGAIN.") + '</div>';
      })
      .then(function () { setLoading(false); });
  }

  btn.addEventListener("click", lookup);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); lookup(); }
  });
})();
